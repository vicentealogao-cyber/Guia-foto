<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lightroom">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Guía Lightroom</title>
<style>
  :root{
    --bg:#111113; --surface:#1b1b1e; --surface-2:#232327;
    --border:#2e2e33; --text:#f2f0ea; --text-2:#a8a6a0; --text-3:#6f6d68;
    --amber:#d98f3b; --amber-dim:#8a5e28; --teal:#3f8577; --teal-dim:#2a5850;
    --red:#c1443c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;}
  body{padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}

  header{position:sticky; top:0; z-index:10; background:rgba(17,17,19,0.92);
    backdrop-filter:blur(10px); padding:14px 18px 0 18px; border-bottom:1px solid var(--border);}
  header h1{font-family:Georgia, "Times New Roman", serif; font-weight:600;
    font-size:22px; margin:2px 0 12px 0; letter-spacing:0.2px;}
  header h1 span{color:var(--amber);}

  nav{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto; background:var(--surface); color:var(--text-2);
    border:1px solid var(--border); border-radius:20px; padding:7px 14px;
    font-size:13px; font-weight:500; white-space:nowrap;}
  nav button.active{background:var(--amber); color:#1a1207; border-color:var(--amber);}

  main{padding:16px 16px 60px 16px; max-width:640px; margin:0 auto;}
  section{display:none;}
  section.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:none;}}

  .intro{font-size:13px; color:var(--text-2); line-height:1.5; margin:2px 0 16px 0;}

  details{background:var(--surface); border:1px solid var(--border); border-radius:12px;
    margin-bottom:8px; overflow:hidden;}
  summary{list-style:none; padding:13px 14px; font-size:15px; font-weight:500;
    display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"+"; color:var(--amber); font-size:18px; font-weight:400;
    transition:transform .15s ease; flex:0 0 auto; margin-left:10px;}
  details[open] summary::after{transform:rotate(45deg);}
  details[open] summary{border-bottom:1px solid var(--border);}
  .body{padding:4px 14px 14px 14px; font-size:13.5px; line-height:1.55; color:var(--text-2);}
  .body p{margin:8px 0;}
  .body b{color:var(--text); font-weight:500;}
  .row{display:flex; gap:8px; margin-top:8px;}
  .row .k{flex:0 0 92px; color:var(--text-3); font-size:11.5px; text-transform:uppercase; letter-spacing:0.3px; padding-top:2px;}
  .row .v{flex:1; font-size:13.5px; color:var(--text-2);}
  .row .v b{color:var(--teal); font-weight:500;}

  .fix{background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--teal);
    border-radius:10px; padding:10px 13px; margin-bottom:8px;}
  .fix .sym{font-size:14px; font-weight:500; color:var(--text); margin-bottom:3px;}
  .fix .sol{font-size:13px; color:var(--text-2);}
  .fix .sol b{color:var(--teal); font-weight:500;}

  .tip{background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:11px 13px; margin-bottom:8px; font-size:13.5px; color:var(--text-2); line-height:1.5;}
  .tip b{color:var(--amber); font-weight:500;}
  .num{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
    border-radius:50%; background:var(--amber-dim); color:#fff; font-size:11px; font-weight:600;
    margin-right:8px; flex:0 0 auto;}

  .diag-q{background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 13px; margin-bottom:8px;}
  .diag-q .q{font-size:14px; font-weight:500; color:var(--text); margin-bottom:5px;}
  .diag-q .a{font-size:13px; color:var(--text-2); line-height:1.5;}
  .diag-q .a b{color:var(--teal); font-weight:500;}
</style>
</head>
<body>

<header>
  <h1>Guía <span>Lightroom</span></h1>
  <nav id="tabs"></nav>
</header>

<main id="content"></main>

<script>
const DATA = {"basicos": {"intro": "Antes de tocar cualquier slider: el histograma y los datos técnicos de la toma te dicen qué esperar.", "cards": [{"t": "Histograma", "b": "<p><b>Qué es:</b> Una gráfica que muestra cuántos píxeles hay en cada nivel de brillo, de negro puro (izquierda) a blanco puro (derecha). Los colores rojo/verde/azul muestran cómo se comporta cada canal por separado.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Si la montaña de información está pegada a la izquierda, tienes zonas muy oscuras (posible pérdida de detalle en sombras). Si está pegada a la derecha, tienes zonas quemadas (blancos sin detalle).</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Te dice objetivamente si hay pérdida de información, algo que el ojo a veces no detecta en una pantalla pequeña.</div></div><div class=\"row\"><div class=\"k\">Caso común</div><div class=\"v\">Una foto de contraluz (cielo muy brillante, sujeto oscuro) tendrá un histograma con dos picos, uno en cada extremo.</div></div>"}, {"t": "ISO", "b": "<p><b>Qué es:</b> La sensibilidad del sensor a la luz.</p><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">ISO alto (800+) = foto tomada con poca luz = vas a tener ruido/grano visible, especialmente en sombras.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">100 (mucha luz) a 3200+ (muy poca luz).</div></div>"}, {"t": "mm (distancia focal)", "b": "<p><b>Qué es:</b> Qué tan \"zoom\" tiene el lente.</p><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Números bajos (6-35mm) = gran angular, distorsiona más los bordes. Números altos (85mm+) = teleobjetivo, comprime la perspectiva.</div></div>"}, {"t": "f/ (apertura)", "b": "<p><b>Qué es:</b> Qué tan abierto estaba el diafragma.</p><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">f/1.8 = mucha luz entrando y poca profundidad de campo (fondo desenfocado, sujeto nítido). f/11+ = poca luz, todo nítido.</div></div>"}, {"t": "Velocidad de obturación", "b": "<p><b>Qué es:</b> Qué tan rápido se tomó la foto.</p><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">1/25 seg es lento — si el sujeto se movió o la mano tembló, vas a ver movimiento borroso (motion blur).</div></div><div class=\"row\"><div class=\"k\">Nota</div><div class=\"v\">Una foto en ISO 800 a f/1.8 y 1/25seg te dice de antemano: va a tener ruido, el fondo va a estar desenfocado, y cuidado con el micro-movimiento. Eso guía qué correcciones vas a necesitar después.</div></div>"}]}, "luz": {"intro": "El brillo y el contraste general de la foto. Empieza siempre aquí.", "cards": [{"t": "Exposición", "b": "<p><b>Qué es:</b> El brillo general de toda la imagen, de forma pareja.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Deslizar a la derecha aclara todo, a la izquierda oscurece todo.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando la foto completa está mal expuesta (muy oscura o muy clara), no solo una zona.</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Si entrecierras los ojos y toda la foto se ve \"gris apagado\" (subexpuesta) o \"lavada\" (sobreexpuesta).</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">-0.5 a +0.5 para ajustes finos; ±1.0 para correcciones más notorias. Pasar de ±1.5 suele ser señal de que la toma estuvo muy mal expuesta.</div></div>"}, {"t": "Contraste", "b": "<p><b>Qué es:</b> La diferencia entre las zonas claras y oscuras de la foto.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Subirlo separa más los negros de los blancos (más \"punch\"); bajarlo aplana la imagen (look más suave, \"mate\").</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Fotos con niebla, día nublado, o que se ven \"planas\" se benefician de subir contraste. Fotos muy duras (sol directo, mediodía) a veces necesitan bajarlo.</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Una foto sin contraste se ve grisácea y sin \"vida\"; con exceso pierdes detalle en sombras y luces (se vuelven bloques negros o blancos puros).</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">+10 a +25 es lo más común para dar viveza sin pasarte.</div></div>"}, {"t": "Iluminaciones (Highlights)", "b": "<p><b>Qué es:</b> Controla solo las zonas más brillantes de la foto (cielo, reflejos, piel iluminada), sin tocar las sombras.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando tienes un cielo quemado, una ventana sobreexpuesta, o luces muy fuertes que necesitas recuperar.</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Recuperar textura/detalle en zonas que se ven blanco puro sin información.</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Bajar Iluminaciones trae de vuelta nubes en un cielo que se veía blanco liso, o detalle en una camisa blanca que se veía plana.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">-20 a -50 cuando hay zonas quemadas que recuperar.</div></div>"}, {"t": "Sombras (Shadows)", "b": "<p><b>Qué es:</b> Controla solo las zonas más oscuras, sin tocar las luces.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando el sujeto está en sombra o a contraluz y quieres ver más detalle sin aclarar toda la foto.</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Abrir detalle escondido en zonas oscuras (una cara en sombra, un callejón).</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Subir Sombras revela textura, ropa, rasgos que antes eran casi negro puro.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">+15 a +40. Cuidado: subir demasiado (+60+) genera ruido visible y look plano/HDR.</div></div>"}, {"t": "Blancos (Whites)", "b": "<p><b>Qué es:</b> Define dónde está el punto de blanco puro real de la imagen (extremo derecho del histograma).</p><div class=\"row\"><div class=\"k\">Diferencia con Iluminaciones</div><div class=\"v\">Iluminaciones afecta un rango amplio de tonos claros; Blancos afecta específicamente el extremo más brillante — más quirúrgico.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Para definir el \"punch\" final, después de ya haber ajustado exposición/contraste.</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Subir Blancos hace que las zonas ya claras se vuelvan blanco puro (bien usado, da nitidez perceptual; en exceso, quema detalle).</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">0 a +20.</div></div>"}, {"t": "Negros (Blacks)", "b": "<p><b>Qué es:</b> Define el punto de negro puro (extremo izquierdo del histograma).</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Para dar profundidad a la foto — un negro bien definido la hace sentir más sólida, menos lavada.</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Bajar Negros hace que las sombras más oscuras se vuelvan negro absoluto, dando más contraste sin afectar los medios tonos.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">-10 a -30. Es de los ajustes más usados casi en toda foto para cerrar la edición.</div></div>"}]}, "color": {"intro": "Todo lo que cambia el color: tono general, canales, colores individuales y tintes creativos.", "cards": [{"t": "Equilibrio de blancos (Temperatura / Matiz / Intensidad / Saturación)", "b": "<p><b>Qué es:</b> Temperatura corrige o estiliza azul↔amarillo. Matiz corrige verde↔magenta. Intensidad y Saturación controlan la fuerza del color general.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Foto con dominante de color no deseada (luz fluorescente, sombra azulada), o para crear mood intencional (cálido/frío).</div></div>"}, {"t": "Curva de tono", "b": "<p><b>Qué es:</b> La versión avanzada y más precisa de Luz. Permite mover puntos específicos del tono, no solo \"sombras\" o \"luces\" en general.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Tocas la línea y arrastras. Bajar el extremo izquierdo = negros más profundos. Subir el extremo derecho = blancos más brillantes. Forma de \"S\" = más contraste, look clásico de película.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando Luz no da suficiente control fino, o quieres un look específico (ej. sombras nunca 100% negras = look \"film fade\").</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Una curva en S da contraste con más matiz que solo subir Contraste; un punto de sombra levantado da ese look desvanecido típico de película analógica.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">Movimientos pequeños (5-15% del eje) ya se notan mucho. Es fácil pasarte.</div></div>"}, {"t": "Curva por canal (R/G/B)", "b": "<p><b>Qué es:</b> En vez de mover el tono general, mueves la curva de un solo color (rojo, verde o azul) por separado.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Para corregir o crear dominantes de color — bajar azul en sombras da un look cálido/vintage; subir rojo en luces da ese \"glow\" cálido cinematográfico.</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Dominantes de color no deseadas (tinte verdoso de luz fluorescente), o crear intencionalmente un look de película.</div></div><div class=\"row\"><div class=\"k\">Nota</div><div class=\"v\">Así se simulan los \"looks de película\" (como tu Kodachrome) — cada rollo de película tenía su propia curva por canal.</div></div>"}, {"t": "Perfeccionar saturación", "b": "<p><b>Qué es:</b> Suaviza cómo la curva afecta la saturación al mismo tiempo que el tono, para que el color no se vea \"roto\" en zonas muy editadas por curva.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Rara vez se toca manualmente; déjalo en 100 (default) salvo que veas colores raros/artificiales tras una curva agresiva.</div></div>"}, {"t": "Mezclador de colores", "b": "<p><b>Qué es:</b> Edita cada uno de los 8 colores de tu foto (rojo, naranja, amarillo, verde, aguamarina, azul, morado, magenta) de forma independiente, usando Tono / Saturación / Luminancia.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Primero eliges el color (ej. tocas el círculo verde si quieres modificar el follaje), luego mueves Tono/Saturación/Luminancia solo de ese color.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando un color específico de la foto no te convence pero el resto sí.</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Control quirúrgico — la diferencia entre \"toda la foto más saturada\" y \"solo el rojo de esa chamarra más saturado\".</div></div><div class=\"row\"><div class=\"k\">Casos comunes</div><div class=\"v\">Bajar Saturación del naranja para calmar tonos de piel sobresaturados · subir Luminancia del azul para aclarar un cielo · mover el Tono del verde hacia amarillo para que el follaje no se vea neón.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">±10 a ±20 ya son notorios. Es una herramienta de precisión, no de brochazo grande.</div></div><div class=\"row\"><div class=\"k\">Nota</div><div class=\"v\">El botón \"Ajustar\" también tiene un modo de arrastrar directo sobre la foto — tocas una zona y Lightroom detecta automáticamente qué color mezclar.</div></div>"}, {"t": "Color de punto", "b": "<p><b>Qué es:</b> Como el Mezclador, pero tú seleccionas con el gotero un color exacto de tu foto y ajustas solo ese tono específico y los que se le parecen.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Tocas el gotero, tocas un punto de la foto, y ajustas Cambio de tono / saturación / luminancia solo de ese color puntual.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando el color que quieres corregir no encaja limpio en una de las 8 categorías del Mezclador (ej. un tono de piel muy específico).</div></div><div class=\"row\"><div class=\"k\">Rango (Varianza)</div><div class=\"v\">Qué tan parecidos deben ser los colores cercanos para que también se vean afectados. Baja = solo el tono exacto; alta = rango más amplio.</div></div><div class=\"row\"><div class=\"k\">Rango (Rango)</div><div class=\"v\">El radio/área de la foto que toma en cuenta el gotero al muestrear el color.</div></div><div class=\"row\"><div class=\"k\">Caso más común</div><div class=\"v\">Corregir el tono de piel exacto de una persona sin afectar otros colores cálidos de la foto (madera, ropa café, etc.)</div></div>"}, {"t": "Gradación de color", "b": "<p><b>Qué es:</b> No editas un color que ya existe — le agregas un tinte de color nuevo a tres zonas tonales: Sombras, Tonos medios, Iluminaciones. Detrás de casi todos los looks cinematográficos.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Tocas la rueda de color de la zona que quieres teñir y arrastras el punto hacia el color — entre más al borde, más intenso el tinte.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando quieres darle una identidad de color/mood a la foto, no corregir un problema. Es 100% creativo, no técnico.</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Cohesión de color — hace que una foto se sienta con estilo en vez de solo bien expuesta.</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Sombras verdosas + luces cálidas se siente cinematográfico; sombras azules + luces cálidas es el look \"teal & orange\" clásico de Hollywood.</div></div><div class=\"row\"><div class=\"k\">Fusión</div><div class=\"v\">Qué tanto se mezclan entre sí las tres zonas en sus bordes. Bajo = transición marcada; alto = transición suave.</div></div><div class=\"row\"><div class=\"k\">Equilibrio</div><div class=\"v\">Desplaza el peso entre Sombras vs. Iluminaciones si ambos están activos.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">Intensidad 10-25 en la rueda. Pasarte de 40+ ya se ve \"filtro de Instagram\".</div></div><div class=\"row\"><div class=\"k\">Diferencia con Mezclador</div><div class=\"v\">El Mezclador edita colores que YA existen; Gradación de color AGREGA un tinte nuevo sobre todo, sin importar qué colores había antes.</div></div>"}]}, "efectos": {"intro": "Ajustes de estilo y textura sobre la foto ya expuesta y balanceada.", "cards": [{"t": "Textura", "b": "<p><b>Qué es:</b> Acentúa detalles de tamaño mediano (piel, tela, madera) sin tocar el grano fino ni los bordes grandes.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Para dar mordida/nitidez a superficies con textura sin endurecer la foto entera.</div></div><div class=\"row\"><div class=\"k\">Diferencia con Enfoque</div><div class=\"v\">Enfoque afecta bordes/contornos; Textura afecta detalle de superficie. Son complementarios.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">+10 a +25. En retratos, subirla de más resalta poros y arrugas — cuidado.</div></div>"}, {"t": "Claridad", "b": "<p><b>Qué es:</b> Contraste local en zonas de tamaño medio-grande (nubes, rocas, edificios). Da sensación de profundidad y punch.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Paisajes, arquitectura, fotos callejeras con muchas texturas grandes.</div></div><div class=\"row\"><div class=\"k\">Cuándo NO usarla</div><div class=\"v\">Retratos — endurece la piel de forma poco favorecedora. Ahí mejor bajarla (-5 a -15) para un look suave.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">+10 a +30 en paisajes/calle.</div></div>"}, {"t": "Borrar neblina", "b": "<p><b>Qué es:</b> Reduce (valores positivos) o agrega (negativos) el efecto de neblina/bruma atmosférica, manipulando el contraste global de forma más agresiva que Claridad.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Fotos con niebla real, contaminación, o \"velo\" (foto lavada por luz dispersa, común a contraluz).</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Valores positivos hacen que colores y contraste \"salten\"; en exceso se ve artificial/HDR.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">+5 a +20 para corregir neblina real; rara vez pasar de +30.</div></div>"}, {"t": "Viñeta", "b": "<p><b>Qué es:</b> Oscurece (o aclara, si es positiva) las esquinas de la foto respecto al centro, guiando la mirada hacia el sujeto.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Casi cualquier foto se beneficia de una viñeta sutil negativa; el ojo no se \"escapa\" por las esquinas.</div></div><div class=\"row\"><div class=\"k\">Punto medio</div><div class=\"v\">Desde dónde (más cerca o lejos del centro) empieza el efecto.</div></div><div class=\"row\"><div class=\"k\">Redondez</div><div class=\"v\">Qué tan circular u ovalada es la forma del oscurecimiento.</div></div><div class=\"row\"><div class=\"k\">Desvanecer</div><div class=\"v\">Qué tan suave es la transición entre la zona oscura y la clara (bajo = borde marcado, alto = degradado suave).</div></div><div class=\"row\"><div class=\"k\">Iluminaciones</div><div class=\"v\">Si quieres que la viñeta respete las zonas ya muy brillantes, para que no se vean sucias al oscurecer encima de un blanco puro.</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">-10 a -20 es sutil y casi imperceptible conscientemente, pero funciona; -25+ ya se nota como \"efecto\".</div></div>"}, {"t": "Granulado", "b": "<p><b>Qué es:</b> Agrega grano/textura artificial, simulando película analógica.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Para look vintage/cinematográfico, o para disimular ruido digital ya existente (un grano uniforme se ve mejor que ruido digital irregular).</div></div><div class=\"row\"><div class=\"k\">Tamaño</div><div class=\"v\">Grano más grande = más visible/artístico; más pequeño = más sutil, tipo película ISO alto fino.</div></div><div class=\"row\"><div class=\"k\">Rugosidad</div><div class=\"v\">Qué tan irregular/orgánico se ve el patrón del grano (bajo = uniforme y limpio, alto = más caótico, tipo película vieja).</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">Cantidad 10-25 para un toque sutil de textura película; 30+ para un look claramente análogo.</div></div>"}]}, "detalle": {"intro": "Nitidez y limpieza de ruido. Se toca al final de la edición.", "cards": [{"t": "Quitar ruido / Detalles Raw / Super Resolución", "b": "<p><b>Qué son:</b> Funciones que solo aplican a fotos RAW. Si aparecen grises/bloqueadas es porque tu foto es JPEG/HEIC, no RAW.</p><div class=\"row\"><div class=\"k\">Nota</div><div class=\"v\">No necesitas preocuparte por esto salvo que empieces a disparar en RAW.</div></div>"}, {"t": "Enfoque", "b": "<p><b>Qué es:</b> Acentúa los bordes/contornos de la imagen para que se vea nítida. Toda foto digital lo necesita un poco porque la captura suaviza ligeramente los bordes.</p><div class=\"row\"><div class=\"k\">Radio</div><div class=\"v\">Qué tan ancho es el borde que se refuerza. Bajo (0.5-1.0) = enfoque fino, detalle pequeño; alto = enfoque más grueso, puede generar halos.</div></div><div class=\"row\"><div class=\"k\">Detalle</div><div class=\"v\">Cuánto se enfocan las texturas finas vs. solo los bordes grandes. Alto = más textura resaltada (riesgo: más ruido visible también).</div></div><div class=\"row\"><div class=\"k\">Máscara</div><div class=\"v\">Muy importante — limita el enfoque solo a bordes reales y protege zonas lisas (piel, cielo). Mantén presionado sobre el slider para ver en blanco y negro qué zonas se enfocan (blanco = se enfoca, negro = protegido).</div></div><div class=\"row\"><div class=\"k\">Rango habitual</div><div class=\"v\">Enfoque 40-70, Radio 1.0, Detalle 25, Máscara 20-60 (sube la máscara si tu foto tiene piel o cielo que no quieres texturizar).</div></div>"}, {"t": "Reducción manual de ruido (Luminancia / Color)", "b": "<p><b>Qué es:</b> Suaviza el ruido/grano no deseado, producto de ISO alto.</p><div class=\"row\"><div class=\"k\">Luminancia</div><div class=\"v\">Reduce el ruido tipo \"granulado\" en brillo/textura. Rango: 10-30 en ISO 800; más alto en ISOs mayores.</div></div><div class=\"row\"><div class=\"k\">Color</div><div class=\"v\">Reduce el ruido tipo \"manchitas de color\" (más molesto visualmente que el de luminancia). Rango: 15-25, casi siempre se puede subir bastante sin perder detalle.</div></div><div class=\"row\"><div class=\"k\">Trade-off</div><div class=\"v\">Más reducción de ruido = menos detalle/nitidez. Es un balance, no \"mientras más mejor\".</div></div>"}]}, "optica": {"intro": "Correcciones técnicas del lente. No cambian el look, corrigen defectos físicos.", "cards": [{"t": "Aberración cromática", "b": "<p><b>Qué es:</b> Un defecto óptico del lente donde, en bordes de mucho contraste (ramas contra el cielo, orilla de un edificio), aparecen franjas de color (típicamente morado/verde) que no existen realmente en la escena.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">\"Quitar la aberración cromática\" es un checkbox — al activarlo, Lightroom detecta y elimina automáticamente esas franjas. No tiene sliders.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Casi siempre conviene tenerlo activado cuando hay bordes de alto contraste en tu foto (ramas, cables, bordes arquitectónicos contra cielo brillante).</div></div><div class=\"row\"><div class=\"k\">Cómo lo notas</div><div class=\"v\">Haz zoom a un borde de alto contraste; si ves una línea morada o verde pegada al borde, es esto.</div></div><div class=\"row\"><div class=\"k\">Qué resuelve</div><div class=\"v\">Limpieza técnica, no estética — no cambia el look de la foto, solo corrige un defecto.</div></div>"}, {"t": "Activar correcciones de lente", "b": "<p><b>Qué es:</b> Usa una base de datos de perfiles de lentes conocidos para corregir distorsión geométrica y viñeteado no deseado que produce el lente físico.</p><div class=\"row\"><div class=\"k\">Por qué aparece un recuadro por rellenar</div><div class=\"v\">Ese campo necesita que Lightroom identifique el lente exacto (marca/modelo) leído de los metadatos de la foto; si no reconoce el lente, el checkbox puede quedar inactivo o sin efecto real aunque lo actives.</div></div><div class=\"row\"><div class=\"k\">Qué pasa activo vs. inactivo</div><div class=\"v\">Activo = Lightroom endereza líneas curvas no deseadas (gran angular que \"abomba\" los bordes) y pareja el viñeteado natural del lente. Inactivo = la foto queda tal cual la capturó el lente, con su distorsión natural.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Fotos de arquitectura o interiores con gran angular, donde líneas que deberían ser rectas se ven curvas.</div></div><div class=\"row\"><div class=\"k\">Caso más común en tu trabajo</div><div class=\"v\">Fotografía callejera con lentes anchos no siempre lo necesita salvo que veas líneas arquitectónicas claramente curvas.</div></div>"}, {"t": "Eliminar halos", "b": "<p><b>Qué es:</b> Corrige un efecto secundario de las correcciones de lente/aberración: un halo/borde claro-oscuro que a veces queda alrededor de zonas muy corregidas.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Solo si, después de corregir aberración cromática, todavía ves un halo sutil de color alrededor del área corregida (poco común).</div></div><div class=\"row\"><div class=\"k\">Tono púrpura (rango 30-70)</div><div class=\"v\">Define qué tono específico de púrpura está buscando eliminar — ajústalo solo si el halo que ves no es del tono por defecto.</div></div><div class=\"row\"><div class=\"k\">Nota</div><div class=\"v\">Rara vez necesitas tocar esto manualmente; es un ajuste de última milla para casos específicos.</div></div>"}, {"t": "Desenfoque de lente", "b": "<p><b>Qué es:</b> Agrega desenfoque artificial de fondo (bokeh simulado) en zonas que tú definas, usualmente vía máscara de Sujeto.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando el fondo de tu foto no está tan desenfocado como te gustaría y quieres simularlo.</div></div><div class=\"row\"><div class=\"k\">Bokeh (las 5 formas)</div><div class=\"v\">El patrón/forma que tendrán las luces desenfocadas del fondo (redondo, tipo \"ojo de gato\", etc.)</div></div><div class=\"row\"><div class=\"k\">Cuidado</div><div class=\"v\">Es un efecto simulado, no óptico real — en exceso o mal aplicado en los bordes del sujeto se nota artificial.</div></div>"}]}, "recorte": {"intro": "Composición final: encuadre, líneas rectas y proporción.", "cards": [{"t": "Aspecto", "b": "<p><b>Qué es:</b> La proporción ancho×alto del encuadre final (3x4, 1x1 cuadrado, 16x9, etc.)</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Al recomponer la imagen para una plataforma específica (cuadrado para feed, vertical para historias) o para mejorar la composición.</div></div>"}, {"t": "Enderezar", "b": "<p><b>Qué es:</b> Rota la imagen para nivelar un horizonte torcido, igual que Rotar en Transformar pero desde el panel de recorte.</p>"}, {"t": "Superposición de recorte — Cuadrícula", "b": "<p><b>Qué es:</b> Una rejilla fina uniforme.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Para alinear elementos rectos (horizontes, arquitectura) con precisión, más que para composición creativa.</div></div>"}, {"t": "Superposición de recorte — Tercios", "b": "<p><b>Qué es:</b> La guía más usada en fotografía. Divide el encuadre en 9 partes iguales.</p><div class=\"row\"><div class=\"k\">Cómo se usa</div><div class=\"v\">Coloca tu sujeto o el horizonte sobre las líneas, y mejor aún, sobre las intersecciones — el ojo humano encuentra esos puntos más interesantes que el centro exacto.</div></div>"}, {"t": "Superposición de recorte — Diagonal", "b": "<p><b>Qué es:</b> Traza las dos diagonales del encuadre.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando tu foto tiene líneas de fuga o elementos que ya siguen una diagonal natural (un camino, una escalera, un brazo extendido) — alinear esa línea con la diagonal refuerza la sensación de movimiento/profundidad.</div></div>"}, {"t": "Superposición de recorte — Centrar", "b": "<p><b>Qué es:</b> Una cruz simple en el centro.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando tu composición es intencionalmente simétrica/centrada (retratos frontales, arquitectura simétrica, reflejos) — ahí SÍ quieres el sujeto en medio, rompiendo la regla de tercios a propósito.</div></div>"}, {"t": "Superposición de recorte — Triángulo", "b": "<p><b>Qué es:</b> Una diagonal principal más dos líneas perpendiculares desde las esquinas opuestas, creando triángulos.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Cuando quieres colocar elementos siguiendo líneas diagonales dinámicas — más avanzado que la guía Diagonal simple, da varias opciones de alineación.</div></div>"}, {"t": "Superposición de recorte — Prop. dorada / Espiral dorada", "b": "<p><b>Prop. dorada:</b> Como Tercios, pero las divisiones no son exactas (33%/67%) sino en la proporción matemática 38%/62% — considerada por muchos la más naturalmente agradable al ojo.</p><div class=\"row\"><div class=\"k\">Espiral dorada</div><div class=\"v\">La misma proporción áurea, pero en forma de espiral. Se usa para composiciones donde quieres que el ojo recorra la foto siguiendo una curva — típico en fotos con elementos que se reducen en tamaño hacia un punto.</div></div>"}, {"t": "Superposición de recorte — Relaciones de aspecto", "b": "<p><b>Qué es:</b> No es una guía visual como las anteriores — es un submenú para cambiar el aspecto de recorte (1:1, 4:5, 16:9, etc.) directamente desde ahí, como atajo al campo Aspecto.</p>"}, {"t": "Cuál usar en la práctica", "b": "<p><b>Regla general:</b> Para el 90% de tus fotos, Tercios es la que más vas a usar — es el estándar de la industria. Recurre a Diagonal/Triángulo cuando la foto tenga líneas de fuga fuertes, y a Centrar cuando el sujeto sea simétrico.</p>"}, {"t": "Geometría — Upright", "b": "<p><b>Qué es:</b> Corrección automática con IA que endereza horizontes y líneas verticales/horizontales torcidas con un clic.</p><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Foto tomada ligeramente inclinada, o con perspectiva forzada al fotografiar edificios desde abajo.</div></div>"}, {"t": "Transformar (Distorsión, Vertical, Horizontal, Rotar, Escala)", "b": "<p><b>Qué es:</b> El control manual equivalente a Upright, pieza por pieza.</p><div class=\"row\"><div class=\"k\">Vertical</div><div class=\"v\">Corrige el efecto de \"el edificio se cae hacia atrás\" al fotografiar hacia arriba.</div></div><div class=\"row\"><div class=\"k\">Horizontal</div><div class=\"v\">Corrige distorsión de perspectiva lateral (fotografiar de lado a un objeto rectangular).</div></div><div class=\"row\"><div class=\"k\">Rotar</div><div class=\"v\">Endereza el horizonte grado por grado.</div></div><div class=\"row\"><div class=\"k\">Escala</div><div class=\"v\">Aumenta el tamaño de la imagen dentro del encuadre — se usa junto con Vertical/Horizontal porque esas correcciones recortan las esquinas y necesitas compensar.</div></div><div class=\"row\"><div class=\"k\">Cuándo se usa</div><div class=\"v\">Arquitectura, interiores, o cualquier foto con líneas que deberían ser rectas y no lo son.</div></div><div class=\"row\"><div class=\"k\">Caso común en tu trabajo</div><div class=\"v\">Poco frecuente en street/travel puro, salvo fotos de edificios o fachadas.</div></div>"}]}, "mascaras": {"intro": "Aplica cualquier ajuste anterior (Luz, Color, Efectos, etc.) solo a una parte de la foto, no a toda.", "cards": [{"t": "Sujeto", "b": "<p><b>Qué es:</b> IA detecta automáticamente a la persona/objeto principal y crea una máscara de solo esa zona. Útil para aclarar/enfocar solo al sujeto sin tocar el fondo.</p>"}, {"t": "Cielo", "b": "<p><b>Qué es:</b> IA detecta y selecciona solo el cielo. Útil para oscurecer un cielo quemado sin afectar el paisaje debajo.</p>"}, {"t": "Fondo", "b": "<p><b>Qué es:</b> El inverso de Sujeto — selecciona todo menos el sujeto principal.</p>"}, {"t": "Paisaje", "b": "<p><b>Qué es:</b> IA detecta y separa elementos típicos de paisaje (terreno, agua, vegetación) automáticamente.</p>"}, {"t": "Objetos", "b": "<p><b>Qué es:</b> Seleccionas manualmente un objeto tocándolo, la IA detecta sus bordes.</p>"}, {"t": "Pincel", "b": "<p><b>Qué es:</b> Pintas a mano libre exactamente la zona que quieres afectar. El control más flexible, pero el más manual.</p>"}, {"t": "Degradado lineal", "b": "<p><b>Qué es:</b> Una transición de intensidad de un lado a otro, con transición suave. Típico para oscurecer solo la mitad superior de un cielo.</p>"}, {"t": "Degradado radial", "b": "<p><b>Qué es:</b> Una transición circular/ovalada. Típico para simular luz enfocada en el sujeto, tipo viñeta manual dirigida.</p>"}, {"t": "Rango (por color o luminancia)", "b": "<p><b>Qué es:</b> Selecciona automáticamente todos los píxeles de cierto color o brillo, sin importar dónde estén en la foto (ej. \"todo lo que sea cielo azul\", \"todo lo que sea muy oscuro\").</p>"}, {"t": "Por qué esto es lo más poderoso", "b": "<p><b>Nota:</b> Cada panel anterior (Luz, Color, Curva, Efectos, Detalle) se puede volver a aplicar dentro de una máscara. Puedes crear una máscara de \"Cielo\" y después bajar exposición + subir contraste + agregar un tinte azul, solo en el cielo, sin tocar nada más.</p><div class=\"row\"><div class=\"k\">Nota 2</div><div class=\"v\">Ahí es donde una edición pasa de \"corrección general\" a \"edición dirigida\" — probablemente la habilidad que más va a subir el nivel de tu trabajo.</div></div>"}]}, "consejos": {"intro": "", "tips": ["El orden importa: <b>Luz → Color → Efectos → Detalle → Óptica → Recorte</b>. Editar fuera de orden hace que reajustes cosas dos veces.", "La meta siempre es la <b>mejor versión real</b> de la foto, no la más dramática. Si dudas si ya es demasiado, probablemente ya es demasiado.", "Antes de subir Contraste/Claridad a lo bruto, revisa si el problema en realidad es de Exposición — corrige la base primero.", "En retratos, sé conservador con Textura y Claridad. En paisaje/calle puedes ser más generoso.", "El histograma no miente aunque tu pantalla esté mal calibrada — revísalo si algo se ve raro.", "Una máscara de Sujeto + un pequeño ajuste de luz suele hacer más que subir Exposición general a toda la foto.", "Guarda tus ediciones favoritas como Preset cuando encuentres un look que se repite — te ahorra reconstruirlo cada vez."]}, "diagnostico": {"intro": "Antes de tocar un slider, mira la foto y pregúntate esto, en este orden.", "qs": [{"q": "¿La foto completa se ve muy oscura o muy clara?", "a": "Es un problema de <b>Exposición</b>, no de Sombras/Luces por separado."}, {"q": "¿Hay una zona quemada (blanco sin detalle) o bloqueada (negro sin detalle)?", "a": "Revisa <b>Iluminaciones</b> o <b>Sombras</b> — o una <b>máscara</b> de esa zona específica."}, {"q": "¿La foto se ve plana, sin vida, apagada?", "a": "Sube <b>Contraste</b> o <b>Claridad</b>, y baja <b>Negros</b> para darle profundidad."}, {"q": "¿Hay un tinte de color raro en toda la foto (verdoso, azulado)?", "a": "Corrige <b>Temperatura/Matiz</b> en Equilibrio de blancos."}, {"q": "¿Un color específico se ve mal (piel naranja, cielo artificial) pero el resto está bien?", "a": "Usa el <b>Mezclador de colores</b> o <b>Color de punto</b>, no el balance general."}, {"q": "¿La foto es técnicamente correcta pero le falta personalidad/mood?", "a": "Aquí entra <b>Gradación de color</b> — es 100% creativo, no corrección."}, {"q": "¿Se ve ruido o grano no deseado (ISO alto)?", "a": "<b>Reducción de ruido</b> en Detalle, con cuidado de no perder nitidez real."}, {"q": "¿Las líneas que deberían ser rectas se ven curvas o inclinadas?", "a": "<b>Geometría/Transformar</b> u Upright, no Recorte."}, {"q": "¿Color o blanco y negro?", "a": "Si el color no aporta información ni emoción a la historia de la foto, o hay muchos colores compitiendo entre sí, considera <b>B&N</b>. Si el color es parte del punto de la foto (una prenda, una luz de neón), <b>a color</b>."}]}, "soluciones": {"intro": "Síntoma → qué tocar primero. Referencia rápida.", "fixes": [{"s": "Cielo quemado/blanco", "f": "Baja <b>Iluminaciones</b> · si no alcanza, máscara de <b>Cielo</b> + Exposición local"}, {"s": "Sujeto muy oscuro (contraluz)", "f": "Sube <b>Sombras</b> · o máscara de <b>Sujeto</b> + Exposición"}, {"s": "Foto se ve plana/lavada", "f": "Sube <b>Contraste</b> y baja <b>Negros</b>"}, {"s": "Tono de piel naranja/rojizo", "f": "<b>Mezclador de colores</b> → Naranja, baja Saturación"}, {"s": "Cielo azul artificial/neón", "f": "<b>Mezclador de colores</b> → Azul, baja Saturación o Luminancia"}, {"s": "Verde de plantas se ve artificial/neón", "f": "<b>Mezclador de colores</b> → Verde, mueve Tono hacia amarillo"}, {"s": "Ruido visible (grano feo)", "f": "<b>Detalle</b> → Reducción de ruido Luminancia/Color"}, {"s": "Foto se ve borrosa/suave", "f": "<b>Detalle</b> → Enfoque, sube Cantidad con Máscara alta"}, {"s": "Franjas de color en bordes", "f": "<b>Óptica</b> → activa Quitar aberración cromática"}, {"s": "Líneas de edificio curvas", "f": "<b>Geometría</b> → Upright o Transformar Vertical/Horizontal"}, {"s": "Foto sin identidad/mood", "f": "<b>Gradación de color</b> en Sombras + Luces, sutil"}, {"s": "Se ve sobreeditada/artificial", "f": "Baja Claridad/Textura y Saturación 20-30%, revisa si el problema era de Exposición base"}]}}
;

const LABELS = {
  basicos:"Básicos", luz:"Luz", color:"Color", efectos:"Efectos", detalle:"Detalle", optica:"Óptica",
  recorte:"Recorte", mascaras:"Máscaras", consejos:"Consejos", diagnostico:"Diagnóstico", soluciones:"Soluciones"
};

const tabsEl = document.getElementById('tabs');
const contentEl = document.getElementById('content');

Object.keys(DATA).forEach((key, i) => {
  const btn = document.createElement('button');
  btn.textContent = LABELS[key];
  btn.dataset.tab = key;
  if (i === 0) btn.classList.add('active');
  btn.onclick = () => selectTab(key);
  tabsEl.appendChild(btn);

  const sec = document.createElement('section');
  sec.id = 'sec-' + key;
  if (i === 0) sec.classList.add('active');

  const d = DATA[key];
  let html = d.intro ? `<p class="intro">${d.intro}</p>` : '';

  if (d.cards) {
    d.cards.forEach(c => {
      html += `<details><summary>${c.t}</summary><div class="body">${c.b}</div></details>`;
    });
  }
  if (d.tips) {
    d.tips.forEach((t, idx) => {
      html += `<div class="tip"><span class="num">${idx+1}</span>${t}</div>`;
    });
  }
  if (d.qs) {
    d.qs.forEach(item => {
      html += `<div class="diag-q"><div class="q">${item.q}</div><div class="a">${item.a}</div></div>`;
    });
  }
  if (d.fixes) {
    d.fixes.forEach(item => {
      html += `<div class="fix"><div class="sym">${item.s}</div><div class="sol">${item.f}</div></div>`;
    });
  }

  sec.innerHTML = html;
  contentEl.appendChild(sec);
});

function selectTab(key) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === key));
  document.querySelectorAll('main section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + key));
  document.querySelector(`nav button[data-tab="${key}"]`).scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  window.scrollTo({top:0, behavior:'instant'});
}
</script>
</body>
</html>
